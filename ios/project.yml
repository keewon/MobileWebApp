name: MobileWebApp
options:
  bundleIdPrefix: app.keewon
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  MobileWebApp:
    type: application
    platform: iOS
    sources:
      - path: MobileWebApp
        excludes:
          - "common/**"
      - path: MobileWebApp/common
        type: folder
        buildPhase: resources
    info:
      path: MobileWebApp/Info.plist
      properties:
        CFBundleDisplayName: MobileWebApp
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserTrackingUsageDescription: "This app uses tracking to provide personalized ads and rewards."
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        TapjoySDKKey: "u1Ao3VMVQ8mDEmAcLKOz5wEB3tJlv3RaFusuXgMp7lVk7DV4P9dIm2kfIoun"
        UnityAdsGameId: "6049795"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keewon.mobilewebapp
        CODE_SIGN_STYLE: Automatic
